[project]
name = "diggypaper-backend"
version = "0.1.0"
license = "MIT"
description = "SaaS souverain de revue systématique de littérature (PubMed/PMC) — backend"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.0",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "fastapi-mail>=1.0",
    "email-validator>=2.0",
    "cryptography>=42.0",
    "celery>=5.3",
    "redis>=5.0",
    "pypdf>=4.0",
    "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `from tests.conftest import …` : la racine du backend doit être importable (CI : `pytest -q`)
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
