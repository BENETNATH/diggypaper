name: Release

# Creates a GitHub release when a version tag is pushed (v1.0.0, v1.1.0, …).
# The version is read from backend/VERSION (single source of truth); the tag name
# must match it (v + the semver in the file) or the release body will disagree.

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from backend/VERSION
        id: version
        run: echo "value=$(cat backend/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Diggypaper v${{ steps.version.outputs.value }}
          generate_release_notes: true
