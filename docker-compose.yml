# Réglages (tous optionnels, voir .env.example) : NGINX_BIND / NGINX_PORT, TRUSTED_PROXY_CIDR,
# WORKER_CONCURRENCY, IMPORT_MAX_ARTICLES, *_MEM_LIMIT, COOKIE_SECURE, APP_BASE_URL…
#
# Services de modèles OPTIONNELS (profils) : par défaut seuls l'application, la base et la file
# de tâches démarrent (suffisant avec un modèle externe : API compatible OpenAI). Activez ceux
# dont vous avez besoin dans .env, ex. COMPOSE_PROFILES=ollama. Le mode est porté par le couple
# OLLAMA_MODE (flag lu par backend/worker) / COMPOSE_PROFILES (conteneurs démarrés) :
#   ollama : modèles génératifs locaux (LLM_API_BASE_URL=http://ollama:11434/v1 par défaut)
#     OLLAMA_MODE=docker : conteneur Ollama du compose (COMPOSE_PROFILES=ollama) — défaut
#     OLLAMA_MODE=host   : Ollama déjà déployé sur la machine (pas de profil ollama,
#                         LLM_API_BASE_URL = URL de l'Ollama hôte, ex. http://host.docker.internal:11434/v1)
#     OLLAMA_MODE=off    : pas d'Ollama (pas de profil ollama, backends API clé uniquement)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diggypaper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diggypaper}
      POSTGRES_DB: ${POSTGRES_DB:-diggypaper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diggypaper}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Serveur d'inférence local (CPU) : les modèles de chat (Qwen, Gemma…) y sont téléchargés
  # depuis l'interface (page Modèles). Les poids persistent dans le volume « ollama ».
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99  # 0.40.3
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    logging: *logging
    mem_limit: ${OLLAMA_MEM_LIMIT:-24g}
    # GPU — décommenter selon le matériel (docs.ollama.com/docker) ; en mode « host » le GPU
    # est celui de l'installation Ollama de la machine (aucune exposition dans ce compose).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia        # NVIDIA (nvidia-container-toolkit requis sur l'hôte)
    #           count: all
    #           capabilities: [gpu]
    # devices:
    #   - /dev/dri                    # Intel (Arc/iGPU) ou AMD en Vulkan (OLLAMA_VULKAN=0 pour
    #                                 # désactiver) ; AMD ROCm : image ollama/ollama:rocm
    #   - /dev/kfd                    # AMD uniquement

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - exports:/app/exports  # zips RO-Crate générés par le worker, servis par le backend
    environment:
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODE: ${OLLAMA_MODE:-docker}  # docker | host | off — flag de déploiement (cf. en-tête)
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}  # timeout par appel LLM (à ↑ sur CPU : cold start + prefill)
      LLM_EXTRA_BODY: '${LLM_EXTRA_BODY:-{"think": false, "options": {"num_ctx": 16384}}}'  # corps additionnel LLM (backends locaux) : num_ctx anti-troncature, pas de mode thinking
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fr}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}  # base des liens des e-mails (invitations, exports)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-diggypaper}:${POSTGRES_PASSWORD:-diggypaper}@postgres:5432/${POSTGRES_DB:-diggypaper}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      ANON_SALT: ${ANON_SALT:?ANON_SALT manquant dans .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY manquant dans .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}  # true derrière HTTPS ; false seulement pour un essai en HTTP
      IMPORT_MAX_ARTICLES: ${IMPORT_MAX_ARTICLES:-5000}
      PRIVACY_URL: ${PRIVACY_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"  # mode host : joindre l'Ollama de la machine hôte (Linux)

  worker:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WORKER_MEM_LIMIT:-8g}
    # WORKER_CONCURRENCY : tâches en parallèle (imports, analyses, exports) ; 3 par défaut.
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "--loglevel=info", "--concurrency=${WORKER_CONCURRENCY:-3}"]
    volumes:
      - exports:/app/exports
    environment:
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODE: ${OLLAMA_MODE:-docker}  # docker | host | off — flag de déploiement (cf. en-tête)
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}  # timeout par appel LLM (à ↑ sur CPU : cold start + prefill)
      LLM_EXTRA_BODY: '${LLM_EXTRA_BODY:-{"think": false, "options": {"num_ctx": 16384}}}'  # corps additionnel LLM (backends locaux) : num_ctx anti-troncature, pas de mode thinking
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-diggypaper}:${POSTGRES_PASSWORD:-diggypaper}@postgres:5432/${POSTGRES_DB:-diggypaper}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      ANON_SALT: ${ANON_SALT:?ANON_SALT manquant dans .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY manquant dans .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}  # base des liens des e-mails (invitations, exports)
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fr}
      SMTP_HOST: ${SMTP_HOST:-}  # e-mails de fin d'analyse / d'export envoyés par le worker
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      IMPORT_MAX_ARTICLES: ${IMPORT_MAX_ARTICLES:-5000}
      TASK_SOFT_TIME_LIMIT: ${TASK_SOFT_TIME_LIMIT:-0}  # secondes ; 0 = pas de limite
      CRATE_LICENSE_URL: ${CRATE_LICENSE_URL:-https://creativecommons.org/licenses/by/4.0/}
      CRATE_LICENSE_NAME: ${CRATE_LICENSE_NAME:-CC BY 4.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy  # les migrations sont appliquées par le backend
    extra_hosts:
      - "host.docker.internal:host-gateway"  # mode host : joindre l'Ollama de la machine hôte (Linux)

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    mem_limit: ${FRONTEND_MEM_LIMIT:-1g}
    environment:
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fr}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      # Seul service exposé. 127.0.0.1 par défaut : visible du reverse proxy de la machine ;
      # NGINX_BIND=0.0.0.0 (ou l'IP d'une interface) si le proxy est sur une autre machine.
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  exports:
  pgdata:
  ollama:
