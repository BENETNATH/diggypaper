# Settings (all optional, see .env.example): NGINX_BIND / NGINX_PORT, TRUSTED_PROXY_CIDR,
# WORKER_CONCURRENCY, IMPORT_MAX_ARTICLES, *_MEM_LIMIT, COOKIE_SECURE, APP_BASE_URL…
#
# « worker » embeds celery beat (-B): run it as a SINGLE replica (each replica would fire
# the periodic tasks again). « worker-ingest » too (NCBI throttle per process, startup
# recovery per queue). Only backend can be scaled.
#
# OPTIONAL model services (profiles): by default only the application, the database and the
# task queue start (sufficient with an external model: OpenAI-compatible API). Enable those
# you need in .env, e.g. COMPOSE_PROFILES=ollama. The mode is carried by the pair
# OLLAMA_MODE (flag read by backend/worker) / COMPOSE_PROFILES (containers started):
#   ollama: local generative models (LLM_API_BASE_URL=http://ollama:11434/v1 by default)
#     OLLAMA_MODE=docker: Ollama container from the compose (COMPOSE_PROFILES=ollama) — default
#     OLLAMA_MODE=host   : Ollama already deployed on the machine (no ollama profile,
#                         LLM_API_BASE_URL = URL of the host's Ollama, e.g. http://host.docker.internal:11434/v1)
#     OLLAMA_MODE=off    : no Ollama (no ollama profile, API-key backends only)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # Pinned to an explicit version tag (pgvector 0.8.7 / Postgres 18) instead
    # of the rolling "pg18" tag, so `docker compose pull` cannot silently swap
    # the DB image. Change deliberately via a reviewed source update.
    image: pgvector/pgvector:0.8.7-pg18
    shm_size: 1g  # parallel queries / pgvector HNSW builds (Docker default: 64 MB)
    mem_limit: ${POSTGRES_MEM_LIMIT:-4g}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diggypaper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-diggypaper}
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]  # gosu/su-exec only drop privileges: allowed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diggypaper}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    # Password via env -> config file at start: absent from the command line (docker inspect, ps).
    # REDISCLI_AUTH is also read by redis-cli (healthcheck).
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}
    command: ["sh", "-c", 'umask 077 && printf "requirepass %s\n" "$$REDISCLI_AUTH" > /tmp/redis.conf && chown redis /tmp/redis.conf && exec docker-entrypoint.sh redis-server /tmp/redis.conf']
    volumes:
      - redisdata:/data  # queued tasks survive a recreate
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local inference server (CPU): chat models (Qwen, Gemma…) are downloaded from the
  # interface (Models page). The weights persist in the « ollama » volume.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99  # 0.40.3
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${OLLAMA_MEM_LIMIT:-24g}
    # GPU — uncomment according to the hardware (docs.ollama.com/docker); in « host » mode the GPU
    # is that of the machine's Ollama installation (no exposure in this compose).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia        # NVIDIA (nvidia-container-toolkit required on the host)
    #           count: all
    #           capabilities: [gpu]
    # devices:
    #   - /dev/dri                    # Intel (Arc/iGPU) or AMD in Vulkan (OLLAMA_VULKAN=0 to
    #                                 # disable); AMD ROCm: image ollama/ollama:rocm
    #   - /dev/kfd                    # AMD only

  backend:
    build:
      context: ./backend
      args:
        # Build-time commit SHA: lets /ci-status report the CI state of the running commit.
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
        # RAG torch variant: cpu (default, portable, ~200 Mo) | cuda (GPU servers, CUDA 12.8).
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - exports:/app/exports  # RO-Crate zips generated by the worker, served by the backend
      - hfcache:/app/.cache  # RAG: Hugging Face cache (embedding model weights, survives rebuilds)
    environment:
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODE: ${OLLAMA_MODE:-docker}  # docker | host | off — deployment flag (see header)
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}  # timeout per LLM call (raise on CPU: cold start + prefill)
      LLM_EXTRA_BODY: '${LLM_EXTRA_BODY:-{"think": false, "options": {"num_ctx": 16384}}}'  # additional LLM body (local backends): num_ctx anti-truncation, no thinking mode
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fr}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}  # base of the email links (invitations, exports)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-diggypaper}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@postgres:5432/${POSTGRES_DB:-diggypaper}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      ANON_SALT: ${ANON_SALT:?ANON_SALT manquant dans .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY manquant dans .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}  # true behind HTTPS; false only for an HTTP trial
      IMPORT_MAX_ARTICLES: ${IMPORT_MAX_ARTICLES:-5000}
      PRIVACY_URL: ${PRIVACY_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}  # port 465 = implicit TLS (flag ignored); other ports: STARTTLS only if true
      SMTP_CA_BUNDLE: ${SMTP_CA_BUNDLE:-}  # container path of the PEM root CA (mounted); empty = system trust store
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}  # JSON array; empty = no CORS (same-origin behind nginx)
      DISK_ALERT_PERCENT: ${DISK_ALERT_PERCENT:-85}  # disk status (Settings page)
      DISK_ALERT_FREE_GB: ${DISK_ALERT_FREE_GB:-5}
      PROJECT_RETENTION_DAYS: ${PROJECT_RETENTION_DAYS:-0}
      PROJECT_RETENTION_GRACE_DAYS: ${PROJECT_RETENTION_GRACE_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"  # host mode: reach the host machine's Ollama (Linux)

  worker:
    build:
      context: ./backend
      args:
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
        # Same torch variant as the backend (one image for both).
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${WORKER_MEM_LIMIT:-8g}
    # WORKER_CONCURRENCY: tasks in parallel (analyses, exports, benchmarks); 3 by default.
    # The imports (NCBI) do not go through here: see « worker-ingest ».
    # Beat schedule on a volume: a recreate (deploy) keeps the last run times instead of
    # pushing every periodic task back by a full interval.
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "-B", "-s", "/app/celerybeat/celerybeat-schedule", "--loglevel=info", "--concurrency=${WORKER_CONCURRENCY:-3}"]
    stop_grace_period: 60s  # let running tasks finish (Docker default: SIGKILL after 10 s)
    healthcheck: &worker-healthcheck
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 > /dev/null"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    volumes:
      - celerybeat:/app/celerybeat
      - exports:/app/exports
      - hfcache:/app/.cache  # RAG: embedding model weights (same cache as the backend)
    environment:
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODE: ${OLLAMA_MODE:-docker}  # docker | host | off — deployment flag (see header)
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}  # timeout per LLM call (raise on CPU: cold start + prefill)
      LLM_EXTRA_BODY: '${LLM_EXTRA_BODY:-{"think": false, "options": {"num_ctx": 16384}}}'  # additional LLM body (local backends): num_ctx anti-truncation, no thinking mode
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-diggypaper}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@postgres:5432/${POSTGRES_DB:-diggypaper}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      ANON_SALT: ${ANON_SALT:?ANON_SALT manquant dans .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY manquant dans .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}  # base of the email links (invitations, exports)
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fr}
      SMTP_HOST: ${SMTP_HOST:-}  # end-of-analysis / export emails sent by the worker
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_CA_BUNDLE: ${SMTP_CA_BUNDLE:-}
      IMPORT_MAX_ARTICLES: ${IMPORT_MAX_ARTICLES:-5000}
      CRATE_LICENSE_URL: ${CRATE_LICENSE_URL:-https://creativecommons.org/licenses/by/4.0/}
      CRATE_LICENSE_NAME: ${CRATE_LICENSE_NAME:-CC BY 4.0}
      DISK_ALERT_PERCENT: ${DISK_ALERT_PERCENT:-85}  # maintenance task (beat, every 6 h)
      DISK_ALERT_FREE_GB: ${DISK_ALERT_FREE_GB:-5}
      PROJECT_RETENTION_DAYS: ${PROJECT_RETENTION_DAYS:-0}
      PROJECT_RETENTION_GRACE_DAYS: ${PROJECT_RETENTION_GRACE_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy  # the migrations are applied by the backend
    extra_hosts:
      - "host.docker.internal:host-gateway"  # host mode: reach the host machine's Ollama (Linux)

  # Ingestion worker: sole consumer of the « ingest » queue (PubMed/Europe PMC/
  # OpenAlex imports, full-text completion), with a single process. The NCBI throttle is per process
  # (3 req/s without key, 10 with): several processes would multiply it beyond the NCBI cap.
  # No « -B » (beat stays on « worker »). At startup it recovers only the interrupted
  # imports of its own « ingest » queue (each worker recovers the jobs of its queues).
  worker-ingest:
    build:
      context: ./backend
      args:
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
        # Same torch variant as the backend (one image for all).
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${INGEST_MEM_LIMIT:-2g}
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "ingest"]
    stop_grace_period: 60s
    healthcheck: *worker-healthcheck
    volumes:
      - exports:/app/exports
    environment:
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODE: ${OLLAMA_MODE:-docker}  # docker | host | off — deployment flag (see header)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-diggypaper}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@postgres:5432/${POSTGRES_DB:-diggypaper}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      ANON_SALT: ${ANON_SALT:?ANON_SALT manquant dans .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY manquant dans .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fr}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_CA_BUNDLE: ${SMTP_CA_BUNDLE:-}
      IMPORT_MAX_ARTICLES: ${IMPORT_MAX_ARTICLES:-5000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy  # the migrations are applied by the backend
    extra_hosts:
      - "host.docker.internal:host-gateway"  # host mode: reach the host machine's Ollama (Linux)

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${FRONTEND_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fr}
      # Origin the server components use to reach the backend (footer version fetch).
      API_ORIGIN: http://backend:8000

  nginx:
    image: nginx:1.30.8-alpine@sha256:8eb04fe3b385090e9aa02961f77398ad09b6bf33ab07f6669a5bb7acce22c0d3
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-256m}
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    ports:
      # Only exposed service. 127.0.0.1 by default: visible from the machine's reverse proxy;
      # NGINX_BIND=0.0.0.0 (or an interface's IP) if the proxy is on another machine.
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  celerybeat:
  exports:
  hfcache:
  pgdata:
  redisdata:
  ollama:
