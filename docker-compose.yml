# Settings (all optional, see .env.example): NGINX_BIND / NGINX_PORT, TRUSTED_PROXY_CIDR,
# WORKER_CONCURRENCY, IMPORT_MAX_ARTICLES, *_MEM_LIMIT, COOKIE_SECURE, APP_BASE_URL…
#
# OPTIONAL model services (profiles): by default only the application, the database and the
# task queue start (sufficient with an external model: OpenAI-compatible API). Enable those
# you need in .env, e.g. COMPOSE_PROFILES=ollama. The mode is carried by the pair
# OLLAMA_MODE (flag read by backend/worker) / COMPOSE_PROFILES (containers started):
#   ollama: local generative models (LLM_API_BASE_URL=http://ollama:11434/v1 by default)
#     OLLAMA_MODE=docker: Ollama container from the compose (COMPOSE_PROFILES=ollama) — default
#     OLLAMA_MODE=host   : Ollama already deployed on the machine (no ollama profile,
#                         LLM_API_BASE_URL = URL of the host's Ollama, e.g. http://host.docker.internal:11434/v1)
#     OLLAMA_MODE=off    : no Ollama (no ollama profile, API-key backends only)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diggypaper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diggypaper}
      POSTGRES_DB: ${POSTGRES_DB:-diggypaper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diggypaper}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local inference server (CPU): chat models (Qwen, Gemma…) are downloaded from the
  # interface (Models page). The weights persist in the « ollama » volume.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99  # 0.40.3
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    logging: *logging
    mem_limit: ${OLLAMA_MEM_LIMIT:-24g}
    # GPU — uncomment according to the hardware (docs.ollama.com/docker); in « host » mode the GPU
    # is that of the machine's Ollama installation (no exposure in this compose).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia        # NVIDIA (nvidia-container-toolkit required on the host)
    #           count: all
    #           capabilities: [gpu]
    # devices:
    #   - /dev/dri                    # Intel (Arc/iGPU) or AMD in Vulkan (OLLAMA_VULKAN=0 to
    #                                 # disable); AMD ROCm: image ollama/ollama:rocm
    #   - /dev/kfd                    # AMD only

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - exports:/app/exports  # RO-Crate zips generated by the worker, served by the backend
    environment:
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODE: ${OLLAMA_MODE:-docker}  # docker | host | off — deployment flag (see header)
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}  # timeout per LLM call (raise on CPU: cold start + prefill)
      LLM_EXTRA_BODY: '${LLM_EXTRA_BODY:-{"think": false, "options": {"num_ctx": 16384}}}'  # additional LLM body (local backends): num_ctx anti-truncation, no thinking mode
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fr}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}  # base of the email links (invitations, exports)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-diggypaper}:${POSTGRES_PASSWORD:-diggypaper}@postgres:5432/${POSTGRES_DB:-diggypaper}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      ANON_SALT: ${ANON_SALT:?ANON_SALT manquant dans .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY manquant dans .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}  # true behind HTTPS; false only for an HTTP trial
      IMPORT_MAX_ARTICLES: ${IMPORT_MAX_ARTICLES:-5000}
      PRIVACY_URL: ${PRIVACY_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"  # host mode: reach the host machine's Ollama (Linux)

  worker:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WORKER_MEM_LIMIT:-8g}
    # WORKER_CONCURRENCY: tasks in parallel (analyses, exports, benchmarks); 3 by default.
    # The imports (NCBI) do not go through here: see « worker-ingest ».
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "--loglevel=info", "--concurrency=${WORKER_CONCURRENCY:-3}"]
    volumes:
      - exports:/app/exports
    environment:
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODE: ${OLLAMA_MODE:-docker}  # docker | host | off — deployment flag (see header)
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}  # timeout per LLM call (raise on CPU: cold start + prefill)
      LLM_EXTRA_BODY: '${LLM_EXTRA_BODY:-{"think": false, "options": {"num_ctx": 16384}}}'  # additional LLM body (local backends): num_ctx anti-truncation, no thinking mode
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-diggypaper}:${POSTGRES_PASSWORD:-diggypaper}@postgres:5432/${POSTGRES_DB:-diggypaper}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      ANON_SALT: ${ANON_SALT:?ANON_SALT manquant dans .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY manquant dans .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}  # base of the email links (invitations, exports)
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fr}
      SMTP_HOST: ${SMTP_HOST:-}  # end-of-analysis / export emails sent by the worker
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      IMPORT_MAX_ARTICLES: ${IMPORT_MAX_ARTICLES:-5000}
      TASK_SOFT_TIME_LIMIT: ${TASK_SOFT_TIME_LIMIT:-0}  # seconds; 0 = no limit
      CRATE_LICENSE_URL: ${CRATE_LICENSE_URL:-https://creativecommons.org/licenses/by/4.0/}
      CRATE_LICENSE_NAME: ${CRATE_LICENSE_NAME:-CC BY 4.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy  # the migrations are applied by the backend
    extra_hosts:
      - "host.docker.internal:host-gateway"  # host mode: reach the host machine's Ollama (Linux)

  # Ingestion worker: sole consumer of the « ingest » queue (PubMed/Europe PMC/
  # OpenAlex imports, full-text completion), with a single process. The NCBI throttle is per process
  # (3 req/s without key, 10 with): several processes would multiply it beyond the NCBI cap.
  # No « -B » (beat stays on « worker ») and no recovery of interrupted jobs
  # (RECOVER_INTERRUPTED=0: otherwise this worker would mark the other's analyses FAILED).
  worker-ingest:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    mem_limit: ${INGEST_MEM_LIMIT:-2g}
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "ingest"]
    volumes:
      - exports:/app/exports
    environment:
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODE: ${OLLAMA_MODE:-docker}  # docker | host | off — deployment flag (see header)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-diggypaper}:${POSTGRES_PASSWORD:-diggypaper}@postgres:5432/${POSTGRES_DB:-diggypaper}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      ANON_SALT: ${ANON_SALT:?ANON_SALT manquant dans .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY manquant dans .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fr}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      IMPORT_MAX_ARTICLES: ${IMPORT_MAX_ARTICLES:-5000}
      TASK_SOFT_TIME_LIMIT: ${TASK_SOFT_TIME_LIMIT:-0}
      RECOVER_INTERRUPTED: "0"  # the startup recovery is done by « worker »
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy  # the migrations are applied by the backend
    extra_hosts:
      - "host.docker.internal:host-gateway"  # host mode: reach the host machine's Ollama (Linux)

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    mem_limit: ${FRONTEND_MEM_LIMIT:-1g}
    environment:
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fr}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      # Only exposed service. 127.0.0.1 by default: visible from the machine's reverse proxy;
      # NGINX_BIND=0.0.0.0 (or an interface's IP) if the proxy is on another machine.
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  exports:
  pgdata:
  ollama:
